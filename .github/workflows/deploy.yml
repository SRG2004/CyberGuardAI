name: Deploy CyberGuard AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint & Test ────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            cyberguard-ui/package-lock.json

      - name: Install & lint backend
        working-directory: backend
        run: |
          npm ci
          npm run lint --if-present

      - name: Install & build frontend
        working-directory: cyberguard-ui
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install & check ML service
        working-directory: ml-service
        run: |
          pip install -r requirements.txt
          python -c "from preprocess import extract_url_features; print('Feature extraction OK')"
          python -c "from main import app; print('FastAPI app OK')"

  # ─── Deploy Backend to Render ───────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            curl -s "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
            echo "Backend deploy triggered"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK not set, skipping"
          fi

  # ─── Deploy ML Service to Render ────────────────────
  deploy-ml:
    name: Deploy ML Service
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -n "${{ secrets.RENDER_ML_DEPLOY_HOOK }}" ]; then
            curl -s "${{ secrets.RENDER_ML_DEPLOY_HOOK }}"
            echo "ML service deploy triggered"
          else
            echo "RENDER_ML_DEPLOY_HOOK not set, skipping"
          fi

  # ─── Deploy Frontend to Vercel ──────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: cyberguard-ui
          vercel-args: --prod
