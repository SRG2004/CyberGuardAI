services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cyberguard
      - ML_SERVICE_URL=http://ml-service:7860
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  ml-service:
    build: ./ml-service
    ports:
      - "7860:7860"
      - "8001:7860"
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/data:/app/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  frontend:
    build:
      context: ./cyberguard-ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
